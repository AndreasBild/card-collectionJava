<div id="consent-banner" class="consent-banner" style="display: none;">
    <div class="consent-content">
        <p>
            Wir verwenden Cookies und Local Storage, um Ihr Erlebnis zu verbessern, z. B. für unser Like- und Bewertungssystem.
            Weitere Informationen finden Sie in unserer <a href="{{ROOT}}privacy.html" class="plain" title="Datenschutzerklärung">Datenschutzerklärung</a>.
        </p>
        <div class="consent-buttons">
            <button id="consent-accept" class="modern-button confirm-btn" title="Zustimmen">Zustimmen</button>
            <button id="consent-reject" class="modern-button cancel-btn" title="Ablehnen">Ablehnen</button>
        </div>
    </div>
</div>

<script>
    (function() {
        const banner = document.getElementById('consent-banner');
        const acceptBtn = document.getElementById('consent-accept');
        const rejectBtn = document.getElementById('consent-reject');
        const CONSENT_KEY = 'user_consent';

        function showBanner() {
            if (!banner) return;
            banner.style.display = 'block';
            banner.classList.add('pulse-highlight');
            try {
                banner.scrollIntoView({ behavior: 'smooth', block: 'end' });
            } catch(e) {}
        }

        function hideBanner() {
            if (!banner) return;
            banner.style.display = 'none';
            banner.classList.remove('pulse-highlight');
        }

        function setConsent(status) {
            localStorage.setItem(CONSENT_KEY, status);
            hideBanner();
            const warningEl = document.getElementById('consent-needed-warning');
            if (warningEl) warningEl.style.display = 'none';
            if (status === 'accepted') {
                window.dispatchEvent(new Event('consent-given'));
            }
        }

        const consent = localStorage.getItem(CONSENT_KEY);
        if (!consent) {
            showBanner();
        }

        if (acceptBtn) acceptBtn.addEventListener('click', () => setConsent('accepted'));
        if (rejectBtn) rejectBtn.addEventListener('click', () => setConsent('rejected'));

        document.addEventListener('click', (e) => {
            if (e.target && e.target.id === 'inline-consent-accept') {
                setConsent('accepted');
            } else if (e.target && e.target.id === 'inline-consent-reject') {
                setConsent('rejected');
            }
        });

        window.setConsent = setConsent;
        window.showConsentBanner = showBanner;
    })();
</script>
